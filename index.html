<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 19th, Sayan ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sky:#dff5ff;
  --sky2:#c8edff;
  --blue:#3b82b5;
  --blue-dark:#173b59;
  --blue-soft:#6b9fbe;
  --pink:#f49abb;
  --pink-dark:#df719b;
  --white:#ffffff;
  --cream:#fffafd;
  --line:rgba(48,105,143,.13);
  --shadow:0 20px 55px rgba(67,133,170,.15);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'DM Sans',sans-serif;
  color:var(--blue-dark);
  background:
    radial-gradient(circle at 10% 5%,rgba(255,255,255,.95),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(255,194,218,.22),transparent 25%),
    linear-gradient(145deg,#e9f9ff 0%,#d9f3ff 45%,#c9edff 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* tiny dreamy dots */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.35;
  background-image:radial-gradient(rgba(65,130,165,.3) 1px,transparent 1px);
  background-size:45px 45px;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

/* ---------------- LOCK SCREEN ---------------- */

#lockScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 20%,#ffffff 0%,#e5f8ff 35%,#c9edff 100%);
  transition:.7s ease;
}

.lock-card{
  width:min(450px,100%);
  padding:45px 32px;
  text-align:center;
  border:1px solid rgba(65,130,165,.12);
  border-radius:32px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(74,139,175,.2);
  animation:float 5s ease-in-out infinite;
}

.lock-heart{
  font-size:44px;
  color:var(--pink);
  margin-bottom:8px;
  animation:pulse 1.8s infinite;
}

.lock-card h1{
  font-family:'Great Vibes',cursive;
  font-size:62px;
  color:var(--blue-dark);
  font-weight:400;
}

.lock-card p{
  color:#6b8da5;
  margin:7px 0 24px;
  line-height:1.7;
}

.lock-input{
  width:100%;
  padding:15px 17px;
  border-radius:16px;
  border:1px solid rgba(55,120,157,.15);
  background:rgba(255,255,255,.8);
  color:var(--blue-dark);
  outline:none;
  text-align:center;
}

.lock-input:focus{
  border-color:#8bcbed;
  box-shadow:0 0 0 4px rgba(139,203,237,.18);
}

.unlock-btn{
  margin-top:13px;
  width:100%;
  padding:15px;
  border:0;
  border-radius:16px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#72b9df,#ee9fbe);
  transition:.25s;
  box-shadow:0 9px 25px rgba(94,164,203,.2);
}

.unlock-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(94,164,203,.28);
}

.error{
  height:22px;
  margin-top:10px;
  color:#df719b;
  font-size:13px;
}

/* ---------------- NAV ---------------- */

.progress{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  background:linear-gradient(90deg,#74c4eb,var(--pink));
  z-index:1000;
  width:0;
}

nav{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:900;
  width:min(1080px,calc(100% - 26px));
  padding:9px 12px;
  border:1px solid rgba(50,115,150,.12);
  border-radius:22px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:center;
  gap:5px;
  overflow:auto;
  box-shadow:0 8px 30px rgba(66,132,165,.08);
}

nav a{
  white-space:nowrap;
  font-size:12px;
  color:#60859e;
  padding:8px 10px;
  border-radius:13px;
  transition:.2s;
}

nav a:hover{
  background:#e3f6ff;
  color:#367ba5;
}

/* ---------------- GENERAL ---------------- */

main{
  display:none;
}

main.show{
  display:block;
}

section{
  padding:110px 20px;
  max-width:1100px;
  margin:auto;
}

.card{
  border:1px solid rgba(52,119,155,.11);
  background:rgba(255,255,255,.67);
  backdrop-filter:blur(14px);
  border-radius:27px;
  box-shadow:var(--shadow);
}

/* ---------------- HERO ---------------- */

.hero{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
  position:relative;
  padding-top:120px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#6097b5;
  margin-bottom:17px;
}

.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(52px,9vw,92px);
  line-height:.98;
  letter-spacing:-2px;
  color:var(--blue-dark);
}

.hero h1 span{
  display:block;
  color:var(--pink-dark);
  font-family:'Great Vibes',cursive;
  font-size:1.08em;
  letter-spacing:0;
  margin-top:4px;
}

.hero .sub{
  max-width:700px;
  margin:24px auto 0;
  color:#6489a2;
  line-height:1.8;
  font-size:17px;
}

.badge{
  display:inline-block;
  margin-top:27px;
  padding:10px 19px;
  border-radius:999px;
  background:rgba(255,255,255,.75);
  border:1px solid rgba(53,121,157,.1);
  color:#5d89a3;
  box-shadow:0 8px 25px rgba(76,143,177,.08);
}

.scroll{
  margin-top:48px;
  color:#82a9bd;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* ---------------- SECTION TITLES ---------------- */

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title .small{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#70a8c5;
}

.section-title h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(35px,6vw,55px);
  margin-top:8px;
  color:var(--blue-dark);
}

.section-title p{
  max-width:650px;
  margin:12px auto 0;
  color:#7395aa;
  line-height:1.75;
}

/* ---------------- DIARY ---------------- */

.diary{
  max-width:850px;
  margin:auto;
  padding:40px clamp(23px,5vw,58px);
  line-height:1.95;
  color:#5c7e95;
  font-size:16px;
}

.diary .dear{
  font-family:'Great Vibes',cursive;
  color:var(--pink-dark);
  font-size:43px;
  margin-bottom:15px;
}

.diary p{
  margin-bottom:18px;
}

.diary strong{
  color:var(--blue-dark);
}

.diary .shout{
  font-weight:800;
  color:#df719b;
  font-size:1.05em;
}
